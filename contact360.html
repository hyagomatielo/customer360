<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact 360 Profile</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --card-bg: linear-gradient(160deg, #1a6da5 0%, #2980b9 30%, #1f7bb5 60%, #1a6da5 100%);
            --text-white: #ffffff;
            --text-light: rgba(255,255,255,0.85);
            --text-muted: rgba(255,255,255,0.6);
            --divider: rgba(255,255,255,0.15);
            --icon-bg: rgba(255,255,255,0.12);
            --icon-border: rgba(255,255,255,0.25);
            --edit-hover: rgba(255,255,255,0.08);
            --bar-track: rgba(255,255,255,0.2);
            --bar-fill: #f5a623;
            --bar-fill-green: #4cd964;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.2s ease;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            margin: 0;
            padding: 0;
            min-height: 100%;
            overflow-x: hidden;
        }

        /* ─── Card Container ────────────────────── */
        .profile-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 28px 24px 24px;
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* ─── Loading / Error States ────────────── */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 12px;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 13px; color: var(--text-light); }
        .error-state { padding: 32px; text-align: center; }
        .error-state h3 { margin-bottom: 8px; }
        .error-state p { color: var(--text-light); font-size: 13px; }

        .hidden { display: none !important; }

        /* ─── Header (Photo + Name) ─────────────── */
        .header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }

        .photo-wrapper {
            position: relative;
            width: 80px; height: 80px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .photo-wrapper:hover .photo-overlay { opacity: 1; }
        .photo {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 3px solid #d4a843;
            object-fit: cover;
            background: rgba(255,255,255,0.1);
        }
        .photo-placeholder {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 3px solid #d4a843;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 600;
            color: var(--text-white);
        }
        .photo-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 80px; height: 80px;
            border-radius: 50%;
            background: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .photo-overlay svg { width: 22px; height: 22px; fill: #fff; }

        .header-info { flex: 1; min-width: 0; }
        .contact-name {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.2px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background var(--transition);
        }
        .contact-name:hover { background: var(--edit-hover); }
        .contact-location {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 2px;
        }

        /* ─── Info Rows ─────────────────────────── */
        .info-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 18px 0;
            border-bottom: 1px solid var(--divider);
        }
        .info-section:last-child { border-bottom: none; }

        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background var(--transition);
        }
        .info-row:hover { background: var(--edit-hover); }

        .info-icon {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--icon-bg);
            border: 1px solid var(--icon-border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .info-icon svg { width: 16px; height: 16px; fill: var(--text-white); }

        .info-content { flex: 1; min-width: 0; }
        .info-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1px;
        }
        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-white);
            word-break: break-word;
        }
        .info-value.empty { color: var(--text-muted); font-style: italic; font-weight: 400; }

        /* ─── Score Rows (with progress bars) ───── */
        .score-section {
            padding: 18px 0;
            border-bottom: 1px solid var(--divider);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .score-section:last-child { border-bottom: none; }

        .score-row {
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background var(--transition);
        }
        .score-row:hover { background: var(--edit-hover); }

        .score-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: var(--bar-track);
            border-radius: 5px;
            overflow: hidden;
            margin-left: 44px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.6s ease;
        }
        .progress-fill.orange { background: var(--bar-fill); }
        .progress-fill.green { background: var(--bar-fill-green); }

        /* ─── Inline Edit ───────────────────────── */
        .inline-edit {
            display: none;
            align-items: center;
            gap: 6px;
            width: 100%;
        }
        .inline-edit.active { display: flex; }
        .inline-edit input, .inline-edit select {
            flex: 1;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            padding: 6px 10px;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
            outline: none;
        }
        .inline-edit input::placeholder { color: rgba(255,255,255,0.4); }
        .inline-edit input:focus, .inline-edit select:focus {
            border-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.2);
        }
        .inline-edit select option { background: #2c7fb8; color: #fff; }
        .edit-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            padding: 6px 8px;
            font-size: 12px;
            transition: background var(--transition);
        }
        .edit-btn:hover { background: rgba(255,255,255,0.3); }
        .edit-btn.save { background: rgba(76,217,100,0.4); }
        .edit-btn.save:hover { background: rgba(76,217,100,0.6); }
        .edit-btn.cancel { background: rgba(255,59,48,0.3); }
        .edit-btn.cancel:hover { background: rgba(255,59,48,0.5); }

        /* toast notification */
        .toast {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Hidden file input */
        #photo-upload { display: none; }
    </style>
</head>
<body>

                </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        // ─── Globals ────────────────────────────────────────────
        let contactId = null;
        let contactData = null;
        let crmBaseUrl = "";

        // ─── Xrm Context ───────────────────────────────────────
        function getXrmContext() {
            // Try to get context from parent form
            if (window.parent && window.parent.Xrm && window.parent.Xrm.Page) {
                return window.parent.Xrm;
            }
            if (window.parent && window.parent.Xrm && window.parent.Xrm.Utility) {
                return window.parent.Xrm;
            }
            return null;
        }

        function getContactIdFromContext() {
            // Method 1: Xrm.Page (classic)
            try {
                const xrm = getXrmContext();
                if (xrm && xrm.Page && xrm.Page.data && xrm.Page.data.entity) {
                    const id = xrm.Page.data.entity.getId();
                    if (id) return id.replace(/[{}]/g, "");
                }
            } catch (e) { /* ignore */ }

            // Method 2: URL query parameter
            const params = new URLSearchParams(window.location.search);
            const dataParam = params.get("data");
            if (dataParam) {
                try {
                    const parsed = JSON.parse(decodeURIComponent(dataParam));
                    if (parsed.id) return parsed.id.replace(/[{}]/g, "");
                } catch (e) { /* ignore */ }
            }
            const idParam = params.get("id");
            if (idParam) return idParam.replace(/[{}]/g, "");

            // Method 3: Try parent URL
            try {
                const parentUrl = window.parent.location.href;
                const match = parentUrl.match(/id=([0-9a-f-]{36})/i);
                if (match) return match[1];
            } catch (e) { /* cross-origin */ }

            return null;
        }

        function getCrmBaseUrl() {
            try {
                const xrm = getXrmContext();
                if (xrm && xrm.Utility && xrm.Utility.getGlobalContext) {
                    return xrm.Utility.getGlobalContext().getClientUrl();
                }
                if (xrm && xrm.Page && xrm.Page.context) {
                    return xrm.Page.context.getClientUrl();
                }
            } catch (e) { /* ignore */ }

            // Fallback: derive from current URL
            const origin = window.location.origin;
            if (origin.includes(".dynamics.com") || origin.includes(".crm")) {
                return origin;
            }

            // Hardcoded fallback
            return "https://hyagom.crm.dynamics.com";
        }

        // ─── API Helpers ────────────────────────────────────────
        async function crmApiFetch(url, options) {
            const apiBase = crmBaseUrl + "/api/data/v9.2";
            const defaults = {
                headers: {
                    "Accept": "application/json",
                    "OData-MaxVersion": "4.0",
                    "OData-Version": "4.0",
                    "Content-Type": "application/json",
                    "Prefer": 'odata.include-annotations="*"',
                },
            };
            const merged = { ...defaults, ...options };
            merged.headers = { ...defaults.headers, ...(options?.headers || {}) };

            const res = await fetch(apiBase + url, merged);
            if (!res.ok) {
                const err = await res.text();
                throw new Error("API error " + res.status + ": " + err);
            }
            if (res.status === 204) return null;
            return res.json();
        }

        async function fetchContact() {
            const select = [
                "fullname", "firstname", "lastname",
                "emailaddress1", "telephone1",
                "address1_line1", "address1_city", "address1_stateorprovince", "address1_postalcode", "address1_composite",
                "cr4e0_customerid", "cr4e0_loyaltytier", "cr4e0_segment",
                "cr4e0_lifetimevalue", "cr4e0_propensitytopurchase", "cr4e0_engagementscore",
                "entityimage_url",
            ].join(",");

            return await crmApiFetch("/contacts(" + contactId + ")?$select=" + select);
        }

        async function updateContact(fields) {
            await crmApiFetch("/contacts(" + contactId + ")", {
                method: "PATCH",
                body: JSON.stringify(fields),
            });
        }

        async function uploadEntityImage(contactId, base64Content) {
            // Upload entity image via PATCH
            await crmApiFetch("/contacts(" + contactId + ")", {
                method: "PATCH",
                body: JSON.stringify({ entityimage: base64Content }),
            });
        }

        // ─── Rendering ─────────────────────────────────────────
        function renderProfile(data) {
            contactData = data;

            // Name
            document.getElementById("contact-name").textContent = data.fullname || "—";

            // Location
            const city = data.address1_city || "";
            const state = data.address1_stateorprovince || "";
            const location = [city, state].filter(Boolean).join(", ");
            document.getElementById("contact-location").textContent = location || "";

            // Photo
            if (data.entityimage_url) {
                const img = document.getElementById("photo-img");
                img.src = crmBaseUrl + data.entityimage_url;
                img.classList.remove("hidden");
                document.getElementById("photo-placeholder").classList.add("hidden");
            } else {
                // Show initials
                const initials = getInitials(data.fullname || "?");
                document.getElementById("photo-placeholder").textContent = initials;
                document.getElementById("photo-placeholder").classList.remove("hidden");
                document.getElementById("photo-img").classList.add("hidden");
            }

            // Info fields
            setFieldValue("val-customerid", data.cr4e0_customerid, "No Customer ID");
            setFieldValue("val-email", data.emailaddress1, "No email");
            setFieldValue("val-phone", data.telephone1, "No phone");

            // Address
            const addr = formatAddress(data);
            setFieldValue("val-address", addr, "No address");

            // Loyalty & Segment
            setFieldValue("val-loyalty", data.cr4e0_loyaltytier, "Not set");
            setFieldValue("val-segment", data.cr4e0_segment, "Not set");

            // Lifetime Value
            const ltv = data.cr4e0_lifetimevalue;
            if (ltv != null) {
                setFieldValue("val-ltv", "$" + Number(ltv).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
            } else {
                setFieldValue("val-ltv", null, "Not set");
            }

            // Propensity to Purchase
            const propensity = data.cr4e0_propensitytopurchase;
            if (propensity != null) {
                setFieldValue("val-propensity", propensity + "%");
                document.getElementById("bar-propensity").style.width = propensity + "%";
            } else {
                setFieldValue("val-propensity", null, "Not set");
                document.getElementById("bar-propensity").style.width = "0%";
            }

            // Engagement Score
            const engagement = data.cr4e0_engagementscore;
            if (engagement != null) {
                setFieldValue("val-engagement", engagement + "%");
                document.getElementById("bar-engagement").style.width = engagement + "%";
            } else {
                setFieldValue("val-engagement", null, "Not set");
                document.getElementById("bar-engagement").style.width = "0%";
            }
        }

        function setFieldValue(elementId, value, emptyText) {
            const el = document.getElementById(elementId);
            if (value) {
                el.textContent = value;
                el.classList.remove("empty");
            } else {
                el.textContent = emptyText || "—";
                el.classList.add("empty");
            }
        }

        function getInitials(name) {
            return name.split(" ").map(w => w.charAt(0).toUpperCase()).slice(0, 2).join("");
        }

        function formatAddress(data) {
            const line1 = data.address1_line1 || "";
            const city = data.address1_city || "";
            const state = data.address1_stateorprovince || "";
            const zip = data.address1_postalcode || "";
            const parts = [];
            if (line1) parts.push(line1);
            const cityStateZip = [city, state].filter(Boolean).join(", ");
            if (cityStateZip) parts.push(cityStateZip);
            if (zip) parts.push(zip);
            return parts.join("\n") || "";
        }

        // ─── Inline Editing ─────────────────────────────────────
        function startEdit(valueId, editId, currentValue) {
            const valEl = document.getElementById(valueId);
            const editEl = document.getElementById(editId);
            valEl.classList.add("hidden");
            editEl.classList.add("active");

            // Set the input value
            const input = editEl.querySelector("input");
            if (input) {
                input.value = currentValue || "";
                input.focus();
            }
        }

        function cancelEdit(valueId, editId) {
            document.getElementById(valueId).classList.remove("hidden");
            const editEl = document.getElementById(editId);
            editEl.classList.remove("active");
        }

        async function saveField(fieldName, inputId, valueId, editId, fieldType) {
            const input = document.getElementById(inputId);
            let newValue = input.value.trim();

            // Convert types
            const updateObj = {};
            if (fieldType === "integer") {
                updateObj[fieldName] = newValue === "" ? null : parseInt(newValue, 10);
            } else if (fieldType === "money") {
                updateObj[fieldName] = newValue === "" ? null : parseFloat(newValue);
            } else {
                updateObj[fieldName] = newValue || null;
            }

            try {
                await updateContact(updateObj);
                // Refresh the data
                const fresh = await fetchContact();
                renderProfile(fresh);
                cancelEdit(valueId, editId);
                showToast("Updated successfully!");
                // Notify parent form to refresh
                try {
                    const xrm = getXrmContext();
                    if (xrm && xrm.Page && xrm.Page.data) {
                        xrm.Page.data.refresh(false);
                    }
                } catch (e) { /* ignore */ }
            } catch (err) {
                showToast("Error: " + err.message);
            }
        }

        async function saveAddress() {
            const line1 = document.getElementById("input-address-line1").value.trim();
            const city = document.getElementById("input-address-city").value.trim();
            const state = document.getElementById("input-address-state").value.trim();
            const zip = document.getElementById("input-address-zip").value.trim();

            try {
                await updateContact({
                    address1_line1: line1 || null,
                    address1_city: city || null,
                    address1_stateorprovince: state || null,
                    address1_postalcode: zip || null,
                });
                const fresh = await fetchContact();
                renderProfile(fresh);
                cancelEdit("val-address", "edit-address");
                showToast("Address updated!");
                try {
                    const xrm = getXrmContext();
                    if (xrm && xrm.Page && xrm.Page.data) xrm.Page.data.refresh(false);
                } catch (e) { /* ignore */ }
            } catch (err) {
                showToast("Error: " + err.message);
            }
        }

        async function saveName(newName) {
            if (!newName) return;
            const parts = newName.trim().split(/\s+/);
            const firstName = parts[0];
            const lastName = parts.slice(1).join(" ") || "";

            try {
                await updateContact({ firstname: firstName, lastname: lastName });
                const fresh = await fetchContact();
                renderProfile(fresh);
                showToast("Name updated!");
                try {
                    const xrm = getXrmContext();
                    if (xrm && xrm.Page && xrm.Page.data) xrm.Page.data.refresh(false);
                } catch (e) { /* ignore */ }
            } catch (err) {
                showToast("Error: " + err.message);
            }
        }

        // ─── Photo Upload ───────────────────────────────────────
        function setupPhotoUpload() {
            const wrapper = document.getElementById("photo-wrapper");
            const fileInput = document.getElementById("photo-upload");

            wrapper.addEventListener("click", () => fileInput.click());

            fileInput.addEventListener("change", async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // Max 10MB
                if (file.size > 10 * 1024 * 1024) {
                    showToast("Image must be under 10MB");
                    return;
                }

                try {
                    showToast("Uploading photo...");
                    const base64 = await fileToBase64(file);
                    await uploadEntityImage(contactId, base64);
                    const fresh = await fetchContact();
                    renderProfile(fresh);
                    showToast("Photo updated!");
                } catch (err) {
                    showToast("Error uploading photo: " + err.message);
                }
                // Reset input
                fileInput.value = "";
            });
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    // Remove data:image/xxx;base64, prefix
                    const base64 = reader.result.split(",")[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ─── Click-to-Edit wiring ───────────────────────────────
        function wireClickToEdit() {
            // Info rows
            document.querySelectorAll(".info-row").forEach(row => {
                row.addEventListener("click", (e) => {
                    // Don't trigger if clicking inside an edit form
                    if (e.target.closest(".inline-edit")) return;

                    const field = row.dataset.field;
                    if (field === "address1") {
                        // Pre-fill address fields
                        document.getElementById("input-address-line1").value = contactData?.address1_line1 || "";
                        document.getElementById("input-address-city").value = contactData?.address1_city || "";
                        document.getElementById("input-address-state").value = contactData?.address1_stateorprovince || "";
                        document.getElementById("input-address-zip").value = contactData?.address1_postalcode || "";
                        startEdit("val-address", "edit-address");
                    } else if (field === "cr4e0_customerid") {
                        startEdit("val-customerid", "edit-customerid", contactData?.cr4e0_customerid);
                    } else if (field === "emailaddress1") {
                        startEdit("val-email", "edit-email", contactData?.emailaddress1);
                    } else if (field === "telephone1") {
                        startEdit("val-phone", "edit-phone", contactData?.telephone1);
                    } else if (field === "cr4e0_loyaltytier") {
                        startEdit("val-loyalty", "edit-loyalty", contactData?.cr4e0_loyaltytier);
                    } else if (field === "cr4e0_segment") {
                        startEdit("val-segment", "edit-segment", contactData?.cr4e0_segment);
                    }
                });
            });

            // Score rows
            document.querySelectorAll(".score-row").forEach(row => {
                row.addEventListener("click", (e) => {
                    if (e.target.closest(".inline-edit")) return;

                    const field = row.dataset.field;
                    if (field === "cr4e0_lifetimevalue") {
                        startEdit("val-ltv", "edit-ltv", contactData?.cr4e0_lifetimevalue);
                    } else if (field === "cr4e0_propensitytopurchase") {
                        startEdit("val-propensity", "edit-propensity", contactData?.cr4e0_propensitytopurchase);
                    } else if (field === "cr4e0_engagementscore") {
                        startEdit("val-engagement", "edit-engagement", contactData?.cr4e0_engagementscore);
                    }
                });
            });

            // Name click-to-edit
            const nameEl = document.getElementById("contact-name");
            nameEl.addEventListener("click", () => {
                const currentName = contactData?.fullname || "";
                const newName = prompt("Edit contact name:", currentName);
                if (newName !== null && newName.trim() !== currentName) {
                    saveName(newName.trim());
                }
            });
        }

        // ─── Toast ──────────────────────────────────────────────
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2500);
        }

        // ─── Init ───────────────────────────────────────────────
        async function init() {
            crmBaseUrl = getCrmBaseUrl();
            contactId = getContactIdFromContext();

            if (!contactId) {
                document.getElementById("loading-screen").classList.add("hidden");
                document.getElementById("error-screen").classList.remove("hidden");
                document.getElementById("error-message").textContent = "No contact ID found. This web resource must be placed on a Contact form.";
                return;
            }

            try {
                const data = await fetchContact();
                document.getElementById("loading-screen").classList.add("hidden");
                document.getElementById("profile-card").classList.remove("hidden");
                renderProfile(data);
                wireClickToEdit();
                setupPhotoUpload();
            } catch (err) {
                document.getElementById("loading-screen").classList.add("hidden");
                document.getElementById("error-screen").classList.remove("hidden");
                document.getElementById("error-message").textContent = err.message;
            }
        }

        // Wait for DOM
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init);
        } else {
            init();
        }
    </script>
</body>
